# Dictation vocabulary -- the single source of truth for the technical terms
# you dictate often. One file, every machine: both installers read this copy
# from the repo root and install it to ~/.config/voxtype/vocabulary.conf.
# Edit here, re-run the installer for that host, done.
#
# This is a STARTER file of well-known terms -- replace its contents with
# your own. It is yours, not the installer's: no sync will ever overwrite a
# vocabulary you have edited here.
#
# Two consumers read it and they are NOT interchangeable:
#
#   [misheard]                 -> whisper.initial_prompt, written by the
#                                 installer for the host
#   [misheard] + [misspelled]  -> the "Prefer these spellings" rule in the
#                                 voxtype-cleanup system prompt, read at
#                                 dictation time
#
# One term per line. Blank lines and #-comments are ignored, leading and
# trailing whitespace is stripped, duplicates are dropped. No commas inside a
# term: the list is comma-joined for both consumers.
#
# WHICH SECTION? Dictate the word and look at the RAW transcription:
#
#   different words came out ("hyper land", "tail scale", "butter FS")
#       -> [misheard]. whisper cannot spell a word it never heard, so the
#          recogniser itself has to be biased toward it.
#   right words, wrong case or spacing ("pytorch", "json", "llama cpp")
#       -> [misspelled]. The cleanup model fixes these after the fact.
#
# [misheard] costs something and [misspelled] is free, so the sections are not
# symmetric. whisper.cpp truncates a long initial_prompt, and on near-silent
# audio whisper's failure mode is to echo the prompt back as if it had been
# spoken -- so every term in [misheard] is part of a sentence of garbage typed
# into whatever is focused the day VAD misses a stray push-to-talk press.
# Default to [misspelled]; promote a term only after watching whisper
# actually mis-HEAR it. Past 40 [misheard] terms the installers warn.
#
# Per-project terms that are not "usual" do not belong here at all -- use
# VOXTYPE_CLEANUP_CONTEXT (not VOXTYPE_CONTEXT, which voxtype itself now
# overwrites). See docs/configuration.md, "Where the vocabulary lives".

[misheard]
Hyprland
Tailscale
btrfs
arXiv
SLURM
voxtype
llama.cpp
GGUF
Qwen
[misspelled]
